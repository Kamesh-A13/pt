name: CD Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Package Container Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notification:
    name: Deployment Summary & Status
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Report Deployment Readiness
        run: |
          echo "=========================================================="
          echo "🚀 StudyOS Continuous Deployment Completed"
          echo "=========================================================="
          echo "Backend & Frontend images pushed to GHCR."
          echo ""
          echo "To deploy to cloud hosting (e.g. Render / Railway / VPS):"
          echo "1. Pull image: ghcr.io/${{ github.repository }}/backend:latest"
          echo "2. Set environment variables:"
          echo "   - OLLAMA_BASE_URL=<your-remote-or-tunneled-ollama-url>"
          echo "   - OLLAMA_MODEL=llama3.2"
          echo "   - DATABASE_PATH=/app/data/studyos.db"
          echo "   - FAISS_INDEX_ROOT=/app/faiss_index"
          echo "=========================================================="
