version: "3.9"

# ---------------------------------------------------------------------------
# StudyOS — AI-Powered Student Assistant (Docker Compose)
#
# Usage:
#   docker compose up --build          # build & run local services
#   docker compose up                  # run with existing images
#   docker compose down                # stop containers
#   docker compose logs -f backend     # tail backend logs
#
# Ollama:
#   By default, the backend connects to your host machine's Ollama instance
#   at http://host.docker.internal:11434. Ensure Ollama is running on your host
#   (e.g., `ollama serve` and `ollama pull llama3.2`).
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # Backend — FastAPI (uvicorn)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyos_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - DATABASE_PATH=/app/data/studyos.db
      - FAISS_INDEX_ROOT=/app/faiss_index
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - backend_faiss:/app/faiss_index
    networks:
      - studyos_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # --------------------------------------------------------------------------
  # Frontend — React / Vite
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyos_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - studyos_net
    depends_on:
      backend:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Optional: Ollama in Docker (uncomment if you wish to run Ollama in a container)
  # --------------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: studyos_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   networks:
  #     - studyos_net

volumes:
  backend_data:
  backend_faiss:
  # ollama_models:

networks:
  studyos_net:
    driver: bridge